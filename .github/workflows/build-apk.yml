name: Build APK

on:
  push:
    branches: ["claude/simple-pingpong-app-X94cm", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Debug environment
        run: |
          echo "=== ANDROID_SDK_ROOT ==="
          echo "$ANDROID_SDK_ROOT"
          echo "=== ANDROID_HOME ==="
          echo "$ANDROID_HOME"
          echo "=== Java version ==="
          java -version
          echo "=== Platforms ==="
          ls "$ANDROID_SDK_ROOT/platforms/" 2>/dev/null || echo "MISSING"
          echo "=== Build-tools ==="
          ls "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null || echo "MISSING"
          echo "=== cmdline-tools ==="
          ls "$ANDROID_SDK_ROOT/cmdline-tools/" 2>/dev/null || echo "MISSING"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_output.txt; exit ${PIPESTATUS[0]}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: gradle_output.txt

      - name: Verify APK was produced
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: taskmanager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
