plugins {
    id 'com.android.application'
}

android {
    namespace 'com.taskmanager.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.taskmanager.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            // Explicit keystore committed to the repo so every build (local and CI)
            // signs with the SAME key. Without this, AGP auto-generates a fresh
            // ~/.android/debug.keystore per machine/CI run, breaking app updates
            // ("App not installed" due to signature mismatch).
            storeFile file("$rootDir/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
}
