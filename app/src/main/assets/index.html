<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ping Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: monospace;
      color: #eee;
    }
    #score {
      font-size: clamp(1rem, 4vw, 2rem);
      margin-bottom: 8px;
      letter-spacing: 8px;
      user-select: none;
    }
    canvas { display: block; }
    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      pointer-events: all;
    }
    #overlay h2 { font-size: clamp(1.2rem, 5vw, 1.8rem); letter-spacing: 3px; }
    #overlay p  { color: #aaa; font-size: clamp(0.7rem, 2.5vw, 0.85rem); text-align: center; padding: 0 12px; }
    button {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-family: monospace;
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      cursor: pointer;
      border-radius: 6px;
      letter-spacing: 2px;
      min-width: 160px;
    }
    button:active { background: #c73652; }
  </style>
</head>
<body>
  <div id="score">0 : 0</div>
  <div style="position:relative">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <h2>PING PONG</h2>
      <p>First to 7 wins</p>
      <button id="startBtn">START GAME</button>
      <p>Touch left/right side to control paddles<br>Keyboard: W/S and ↑/↓</p>
    </div>
  </div>

  <script>
    const canvas  = document.getElementById('canvas');
    const ctx     = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');

    // Logical game dimensions
    const W = 700, H = 450;
    const PADDLE_W = 12, PADDLE_H = 80, SPEED = 5, WIN_SCORE = 7;

    let state = 'idle';
    let p1, p2, ball, keys, touchTargets;

    // Scale canvas to fill screen while keeping aspect ratio
    function resize() {
      const scaleX = window.innerWidth  / W;
      const scaleY = (window.innerHeight - 50) / H;
      const scale  = Math.min(scaleX, scaleY);
      canvas.width  = W;
      canvas.height = H;
      canvas.style.width  = (W * scale) + 'px';
      canvas.style.height = (H * scale) + 'px';
    }
    window.addEventListener('resize', resize);
    resize();

    function reset() {
      p1           = { x: 20,             y: H/2 - PADDLE_H/2, score: 0 };
      p2           = { x: W-20-PADDLE_W,  y: H/2 - PADDLE_H/2, score: 0 };
      ball         = newBall(1);
      keys         = {};
      touchTargets = { left: null, right: null };
    }

    function newBall(dir) {
      const angle = (Math.random() * 40 - 20) * Math.PI / 180;
      return { x: W/2, y: H/2, r: 8,
               vx: Math.cos(angle) * 6 * dir,
               vy: Math.sin(angle) * 6 };
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    // ----- Touch -----
    function canvasY(clientY) {
      const rect  = canvas.getBoundingClientRect();
      return (clientY - rect.top) * (H / rect.height);
    }
    function canvasX(clientX) {
      const rect  = canvas.getBoundingClientRect();
      return (clientX - rect.left) * (W / rect.width);
    }

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (state !== 'playing') { startGame(); return; }
      for (const t of e.changedTouches) {
        if (canvasX(t.clientX) < W / 2) touchTargets.left  = canvasY(t.clientY);
        else                             touchTargets.right = canvasY(t.clientY);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (canvasX(t.clientX) < W / 2) touchTargets.left  = canvasY(t.clientY);
        else                             touchTargets.right = canvasY(t.clientY);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (canvasX(t.clientX) < W / 2) touchTargets.left  = null;
        else                             touchTargets.right = null;
      }
    }, { passive: false });

    // ----- Update -----
    function update() {
      if (state !== 'playing') return;

      // P1 – touch wins over keyboard
      if (touchTargets.left !== null) {
        p1.y = clamp(touchTargets.left - PADDLE_H / 2, 0, H - PADDLE_H);
      } else {
        if (keys['w'] || keys['W']) p1.y -= SPEED;
        if (keys['s'] || keys['S']) p1.y += SPEED;
        p1.y = clamp(p1.y, 0, H - PADDLE_H);
      }

      // P2
      if (touchTargets.right !== null) {
        p2.y = clamp(touchTargets.right - PADDLE_H / 2, 0, H - PADDLE_H);
      } else {
        if (keys['ArrowUp'])   p2.y -= SPEED;
        if (keys['ArrowDown']) p2.y += SPEED;
        p2.y = clamp(p2.y, 0, H - PADDLE_H);
      }

      // Ball movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y - ball.r < 0)  { ball.y = ball.r;     ball.vy *= -1; }
      if (ball.y + ball.r > H)  { ball.y = H - ball.r; ball.vy *= -1; }

      function hitPaddle(p) {
        return ball.x - ball.r < p.x + PADDLE_W &&
               ball.x + ball.r > p.x &&
               ball.y + ball.r > p.y &&
               ball.y - ball.r < p.y + PADDLE_H;
      }

      if (hitPaddle(p1) && ball.vx < 0) {
        ball.x = p1.x + PADDLE_W + ball.r;
        const rel = (ball.y - (p1.y + PADDLE_H/2)) / (PADDLE_H/2);
        const spd = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 20);
        ball.vx =  Math.cos(rel * Math.PI/3) * spd;
        ball.vy =  Math.sin(rel * Math.PI/3) * spd;
      }
      if (hitPaddle(p2) && ball.vx > 0) {
        ball.x = p2.x - ball.r;
        const rel = (ball.y - (p2.y + PADDLE_H/2)) / (PADDLE_H/2);
        const spd = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 20);
        ball.vx = -Math.cos(rel * Math.PI/3) * spd;
        ball.vy =  Math.sin(rel * Math.PI/3) * spd;
      }

      if (ball.x + ball.r < 0) { p2.score++; checkWin() || (ball = newBall( 1)); }
      if (ball.x - ball.r > W) { p1.score++; checkWin() || (ball = newBall(-1)); }

      scoreEl.textContent = `${p1.score} : ${p2.score}`;
    }

    function checkWin() {
      if (p1.score < WIN_SCORE && p2.score < WIN_SCORE) return false;
      state = 'over';
      const winner = p1.score >= WIN_SCORE ? 'Player 1' : 'Player 2';
      overlay.innerHTML = `
        <h2>${winner} wins!</h2>
        <p>${p1.score} : ${p2.score}</p>
        <button id="startBtn">PLAY AGAIN</button>
        <p>Tap anywhere or press button</p>
      `;
      overlay.style.display = 'flex';
      document.getElementById('startBtn').onclick = startGame;
      return true;
    }

    // ----- Draw -----
    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Touch zone hints (subtle)
      if (touchTargets.left !== null) {
        ctx.fillStyle = 'rgba(233,69,96,0.08)';
        ctx.fillRect(0, 0, W/2, H);
      }
      if (touchTargets.right !== null) {
        ctx.fillStyle = 'rgba(15,52,96,0.15)';
        ctx.fillRect(W/2, 0, W/2, H);
      }

      // Centre line
      ctx.setLineDash([10, 10]);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#e94560';
      ctx.fillRect(p1.x, p1.y, PADDLE_W, PADDLE_H);
      ctx.fillStyle = '#0f3460';
      ctx.fillRect(p2.x, p2.y, PADDLE_W, PADDLE_H);

      // Ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#eee';
      ctx.fill();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    function startGame() {
      reset();
      state = 'playing';
      overlay.style.display = 'none';
      scoreEl.textContent = '0 : 0';
    }

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === 'Escape') {
        if (state === 'playing') {
          state = 'paused';
          overlay.innerHTML = `<h2>PAUSED</h2><button id="startBtn">RESUME</button><p>Tap or press ESC</p>`;
          overlay.style.display = 'flex';
          document.getElementById('startBtn').onclick = resume;
        } else if (state === 'paused') resume();
      }
      if (['ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    function resume() { state = 'playing'; overlay.style.display = 'none'; }

    document.getElementById('startBtn').onclick = startGame;

    reset();
    loop();
  </script>
</body>
</html>
