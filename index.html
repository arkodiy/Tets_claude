<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ping Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body {
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: monospace;
      color: #eee;
    }
    canvas { display: block; }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #overlay h2 { font-size: clamp(1.4rem, 6vw, 2rem); letter-spacing: 3px; }
    #overlay p  { color: #aaa; font-size: clamp(0.75rem, 3vw, 0.9rem); text-align: center; }
    button {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-family: monospace;
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      cursor: pointer;
      border-radius: 6px;
      letter-spacing: 2px;
      min-width: 170px;
    }
    button:active { background: #c73652; }
  </style>
</head>
<body>
  <div style="position:relative">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <h2>PING PONG</h2>
      <p>Beat the computer!</p>
      <button id="startBtn">START GAME</button>
      <p>Drag to move your paddle<br>← → arrow keys also work</p>
    </div>
  </div>

  <script>
    const canvas  = document.getElementById('canvas');
    const ctx     = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');

    const W = 360, H = 620;
    const PW = 80, PH = 12, MARGIN = 30, BALL_R = 8, WIN = 7;

    let state = 'idle';
    let player, cpu, ball, keys, touchGameX;

    function resize() {
      const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
      canvas.width  = W;
      canvas.height = H;
      canvas.style.width  = (W * scale) + 'px';
      canvas.style.height = (H * scale) + 'px';
    }
    window.addEventListener('resize', resize);
    resize();

    function reset() {
      player     = { x: W/2 - PW/2, y: H - MARGIN - PH, score: 0 };
      cpu        = { x: W/2 - PW/2, y: MARGIN,            score: 0 };
      ball       = newBall(1);
      keys       = {};
      touchGameX = null;
    }

    function newBall(dir) {
      const angle = (Math.random() * 50 - 25) * Math.PI / 180;
      return { x: W/2, y: H/2, r: BALL_R,
               vx: Math.sin(angle) * 5,
               vy: Math.cos(angle) * 5 * dir };
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    // Touch – player paddle follows finger X
    function getTouchX(clientX) {
      const rect = canvas.getBoundingClientRect();
      return (clientX - rect.left) * (W / rect.width);
    }

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (state !== 'playing') { startGame(); return; }
      touchGameX = getTouchX(e.changedTouches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      touchGameX = getTouchX(e.changedTouches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      touchGameX = null;
    }, { passive: false });

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (['ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
      if (e.key === 'Escape') {
        if (state === 'playing') pause();
        else if (state === 'paused') resume();
      }
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    function update() {
      if (state !== 'playing') return;

      // Player paddle (touch wins over keyboard)
      if (touchGameX !== null) {
        player.x = clamp(touchGameX - PW/2, 0, W - PW);
      } else {
        const ps = 6;
        if (keys['ArrowLeft']  || keys['a'] || keys['A']) player.x -= ps;
        if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += ps;
        player.x = clamp(player.x, 0, W - PW);
      }

      // CPU AI – tracks ball X at limited speed
      const aiSpd = 3.2;
      const diff  = ball.x - (cpu.x + PW/2);
      cpu.x += Math.sign(diff) * Math.min(Math.abs(diff), aiSpd);
      cpu.x = clamp(cpu.x, 0, W - PW);

      // Ball
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Side walls
      if (ball.x - ball.r < 0) { ball.x = ball.r;     ball.vx *= -1; }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx *= -1; }

      // Player paddle hit (bottom)
      if (ball.vy > 0 &&
          ball.y + ball.r >= player.y &&
          ball.y - ball.r <= player.y + PH &&
          ball.x + ball.r >= player.x && ball.x - ball.r <= player.x + PW) {
        ball.y = player.y - ball.r;
        deflect(player.x, -1);
      }

      // CPU paddle hit (top)
      if (ball.vy < 0 &&
          ball.y - ball.r <= cpu.y + PH &&
          ball.y + ball.r >= cpu.y &&
          ball.x + ball.r >= cpu.x && ball.x - ball.r <= cpu.x + PW) {
        ball.y = cpu.y + PH + ball.r;
        deflect(cpu.x, 1);
      }

      // Scoring
      if (ball.y > H) { cpu.score++;    checkWin() || (ball = newBall( 1)); }
      if (ball.y < 0) { player.score++; checkWin() || (ball = newBall(-1)); }
    }

    function deflect(paddleX, dir) {
      const rel = clamp((ball.x - (paddleX + PW/2)) / (PW/2), -1, 1);
      const spd = Math.min(Math.hypot(ball.vx, ball.vy) * 1.04, 18);
      ball.vx = Math.sin(rel * Math.PI/3) * spd;
      ball.vy = Math.cos(rel * Math.PI/3) * spd * dir;
    }

    function checkWin() {
      if (player.score < WIN && cpu.score < WIN) return false;
      state = 'over';
      const won = player.score >= WIN;
      overlay.innerHTML = `
        <h2>${won ? 'YOU WIN!' : 'CPU WINS'}</h2>
        <p>${player.score} : ${cpu.score}</p>
        <button id="startBtn">PLAY AGAIN</button>
      `;
      overlay.style.display = 'flex';
      document.getElementById('startBtn').onclick = startGame;
      return true;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Center dashed line
      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = '#2a2a4a';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();
      ctx.setLineDash([]);

      // Scores (large, subtle watermark in each half)
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.font = 'bold 52px monospace';
      ctx.fillText(cpu.score,    W/2, H*0.28);
      ctx.fillText(player.score, W/2, H*0.72);

      // "CPU" / "YOU" labels
      ctx.font = '11px monospace';
      ctx.fillStyle = '#3a3a5a';
      ctx.fillText('CPU', W/2, H*0.28 - 38);
      ctx.fillText('YOU', W/2, H*0.72 - 38);

      // CPU paddle (top, blue)
      ctx.fillStyle = '#0f3460';
      ctx.fillRect(cpu.x, cpu.y, PW, PH);

      // Player paddle (bottom, red)
      ctx.fillStyle = '#e94560';
      ctx.fillRect(player.x, player.y, PW, PH);

      // Ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#eee';
      ctx.fill();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    function startGame() {
      reset();
      state = 'playing';
      overlay.style.display = 'none';
    }

    function pause() {
      state = 'paused';
      overlay.innerHTML = `<h2>PAUSED</h2><button id="startBtn">RESUME</button><p>Press ESC or tap</p>`;
      overlay.style.display = 'flex';
      document.getElementById('startBtn').onclick = resume;
      canvas.addEventListener('touchstart', resume, { once: true });
    }

    function resume() {
      state = 'playing';
      overlay.style.display = 'none';
    }

    document.getElementById('startBtn').onclick = startGame;
    reset();
    loop();
  </script>
</body>
</html>
